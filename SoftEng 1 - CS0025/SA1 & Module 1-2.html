<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SA1 &amp; Formative Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
:root{
  --bg:#e9edf1; --surface:#ffffff; --surface-sunk:#f3f6f9;
  --ink:#19222e; --ink-soft:#5a6875; --rule:#d3dae1;
  --accent:#1d5b8f; --right:#136b45; --right-bg:#e2f3ea;
  --wrong:#a32a1f; --wrong-bg:#fbe8e5; --skip:#8a6a17; --skip-bg:#fbf1da;
  --shadow:0 1px 0 rgba(25,34,46,.06), 0 10px 24px -18px rgba(25,34,46,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151a21; --surface:#1d242d; --surface-sunk:#232b35;
    --ink:#e6ebf0; --ink-soft:#9aa7b4; --rule:#313b47;
    --accent:#6fb0e6; --right:#5cc994; --right-bg:#17352a;
    --wrong:#f09489; --wrong-bg:#3a1f1c; --skip:#e0bd6a; --skip-bg:#332a15;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 24px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#151a21; --surface:#1d242d; --surface-sunk:#232b35;
  --ink:#e6ebf0; --ink-soft:#9aa7b4; --rule:#313b47;
  --accent:#6fb0e6; --right:#5cc994; --right-bg:#17352a;
  --wrong:#f09489; --wrong-bg:#3a1f1c; --skip:#e0bd6a; --skip-bg:#332a15;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 24px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding:clamp(16px,4vw,44px) clamp(12px,4vw,24px) 72px;
}
.wrap{max-width:660px;margin:0 auto}
.masthead{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:1.4rem}
.masthead .code{font-family:"IBM Plex Mono",monospace;font-size:.8rem;font-weight:600;color:var(--accent);
  border:1px solid var(--rule);border-radius:3px;padding:.15rem .4rem;background:var(--surface)}
.masthead h1{font-size:1.15rem;font-weight:600;margin:0;letter-spacing:-.01em}
.masthead p{margin:0;color:var(--ink-soft);font-size:.85rem}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:6px;
  box-shadow:var(--shadow);padding:clamp(18px,4vw,28px)}

/* setup */
.field{margin-bottom:1.5rem}
.field>.lede{font-size:.9rem;font-weight:600;margin:0 0 .15rem}
.field>.hint{font-size:.82rem;color:var(--ink-soft);margin:0 0 .7rem}
.segs{display:flex;flex-wrap:wrap;gap:.4rem}
.seg{flex:1 1 150px;text-align:left;cursor:pointer;background:var(--surface-sunk);
  border:1px solid var(--rule);border-radius:5px;padding:.6rem .7rem;color:var(--ink);font:inherit;font-size:.88rem;
  transition:border-color .15s,background .15s}
.seg .n{display:block;font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink-soft);margin-top:.15rem}
.seg[aria-pressed="true"]{border-color:var(--accent);background:var(--surface);box-shadow:inset 0 0 0 1px var(--accent)}
.seg[aria-pressed="true"] .n{color:var(--accent)}
.switch{display:flex;align-items:flex-start;gap:.65rem;padding:.55rem 0;cursor:pointer}
.switch input{margin:.25rem 0 0;width:1.05rem;height:1.05rem;accent-color:var(--accent);flex:none}
.switch span{font-size:.9rem}
.switch small{display:block;color:var(--ink-soft);font-size:.8rem}

.btn{font:inherit;font-weight:600;font-size:.92rem;cursor:pointer;border-radius:5px;
  padding:.65rem 1.15rem;border:1px solid var(--accent);background:var(--accent);color:#fff;transition:filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;color:var(--ink-soft);border-color:var(--rule)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{font-size:.85rem;padding:.5rem .8rem}
.btnrow{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.4rem}

/* nav */
.meter{display:flex;gap:3px;margin-bottom:1.1rem}
.meter i{flex:1;height:4px;border-radius:2px;background:var(--rule)}
.meter i.ok{background:var(--right)}
.meter i.no{background:var(--wrong)}
.meter i.sk{background:var(--skip)}
.meter i.now{background:var(--accent);height:6px;margin-top:-1px}
.qhead{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;
  font-family:"IBM Plex Mono",monospace;font-size:.75rem;color:var(--ink-soft);
  border-bottom:1px solid var(--rule);padding-bottom:.5rem;margin-bottom:1rem}
.qhead button{font:inherit;background:none;border:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
.grid{display:none;grid-template-columns:repeat(auto-fill,minmax(2.4rem,1fr));gap:.3rem;
  padding:.8rem;margin-bottom:1.1rem;background:var(--surface-sunk);border:1px solid var(--rule);border-radius:5px}
.grid.open{display:grid}
.jump{font-family:"IBM Plex Mono",monospace;font-size:.82rem;font-weight:500;cursor:pointer;
  border:1px solid var(--rule);border-radius:4px;background:var(--surface);color:var(--ink-soft);padding:.4rem 0;transition:.12s}
.jump:hover{border-color:var(--accent);color:var(--accent)}
.jump.ok{background:var(--right-bg);border-color:var(--right);color:var(--right)}
.jump.no{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong)}
.jump.sk{background:var(--skip-bg);border-color:var(--skip);color:var(--skip)}
.jump.now{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.legend{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.75rem;font-size:.74rem;color:var(--ink-soft);
  font-family:"IBM Plex Mono",monospace;margin-top:.2rem}
.legend s{text-decoration:none;display:inline-flex;align-items:center;gap:.3rem}
.legend b{width:.55rem;height:.55rem;border-radius:2px;display:inline-block}

.qsec{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:.7rem;font-weight:600;
  color:var(--accent);background:var(--surface-sunk);border:1px solid var(--rule);border-radius:3px;
  padding:.1rem .4rem;margin:0 0 .5rem}
.qtext{font-size:1.06rem;font-weight:500;margin:0 0 1.1rem;line-height:1.45}
.choices{display:flex;flex-direction:column;gap:.45rem}
.choice{display:flex;gap:.7rem;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:.95rem;
  color:var(--ink);cursor:pointer;background:var(--surface-sunk);border:1px solid var(--rule);border-radius:5px;
  padding:.7rem .8rem;transition:border-color .12s,background .12s}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default}
.choice .key{font-family:"IBM Plex Mono",monospace;font-size:.78rem;font-weight:600;color:var(--ink-soft);
  flex:none;width:1.2rem;padding-top:.1rem}
.choice .mark{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:.75rem;font-weight:600;flex:none;padding-top:.1rem}
.choice.right{background:var(--right-bg);border-color:var(--right);color:var(--right)}
.choice.right .key{color:var(--right)}
.choice.wrong{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong)}
.choice.wrong .key{color:var(--wrong)}
.choice.dim{opacity:.5}
.fillrow{display:flex;gap:.5rem;flex-wrap:wrap}
.fillrow input{flex:1 1 220px;font:inherit;font-size:.98rem;font-family:"IBM Plex Mono",monospace;
  background:var(--surface-sunk);border:1px solid var(--rule);border-radius:5px;padding:.65rem .8rem;color:var(--ink)}
.fillrow input:focus{outline:none;border-color:var(--accent)}
.fillrow input.right{background:var(--right-bg);border-color:var(--right);color:var(--right)}
.fillrow input.wrong{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong)}
.fillrow input:disabled{cursor:default}
.btn:focus-visible,.seg:focus-visible,.choice:focus-visible,.jump:focus-visible,.qhead button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.verdict{margin-top:1rem;font-size:.9rem;display:none}
.verdict.show{display:block}
.verdict b{font-family:"IBM Plex Mono",monospace;font-size:.78rem;letter-spacing:.02em}
.verdict.hit b{color:var(--right)}
.verdict.miss b{color:var(--wrong)}
.verdict p{margin:.2rem 0 0;color:var(--ink-soft)}
.flagnote{margin-top:.8rem;font-size:.8rem;color:var(--ink-soft);border-left:2px solid var(--rule);padding-left:.6rem}
.nav{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:1.3rem;
  border-top:1px solid var(--rule);padding-top:1rem}
.nav .spacer{flex:1}
.pending{font-size:.78rem;color:var(--skip);font-family:"IBM Plex Mono",monospace;width:100%}

/* score */
.score{display:flex;align-items:baseline;gap:.6rem;margin:0 0 .3rem}
.score b{font-family:"IBM Plex Mono",monospace;font-size:3rem;font-weight:600;line-height:1;letter-spacing:-.03em}
.score span{color:var(--ink-soft);font-size:.9rem}
.scoreline{color:var(--ink-soft);font-size:.9rem;margin:0 0 1.4rem}
.review{border-top:1px solid var(--rule);margin-top:1.4rem;padding-top:1rem}
.review h2{font-size:.85rem;font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink-soft);margin:0 0 .8rem}
.miss{border-left:2px solid var(--wrong);padding:.1rem 0 .1rem .7rem;margin-bottom:1rem}
.miss.unans{border-color:var(--skip)}
.miss p{margin:0;font-size:.92rem}
.miss .yours{color:var(--wrong);font-size:.85rem;margin-top:.25rem}
.miss .none{color:var(--skip);font-size:.85rem;margin-top:.25rem}
.miss .truth{color:var(--right);font-size:.85rem}
.allgood{color:var(--right);font-size:.92rem}
.foot{margin-top:1.2rem;font-size:.78rem;color:var(--ink-soft);text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <span class="code">SA1</span>
    <h1>Software Engineering &amp; Project Management</h1>
    <p>SA1 & Module 1&ndash;2 reviewer</p>
  </header>
  <main id="stage" class="panel"></main>
  <p class="foot">40 questions compiled from SA1 Module 1&ndash;2 and Formatives 1 &amp; 2.</p>
  <p class="foot">If you'd also like to study this material offline, <a href="#" onclick="downloadFile('https://raw.githubusercontent.com/akiiresu/reviewers-compilation/refs/heads/main/SoftEng%201%20-%20CS0025/SA1%20%26%20Module%201-2.html','CS0025_SA1_M1-2_Reviewer.html')">download it here.</a></p>
  <button id="back-btn" onclick="window.location.href='../index.html'">Back</button>
</div>

<script>
const BANK = [
/* ---------------- SA1 : Module 1-2 (20) ---------------- */
{sec:"sa1",type:"mc",q:"Software engineering is a systematic, disciplined, and quantifiable approach to the development, operation, and maintenance of software.",
 c:["True","False"],a:0},
{sec:"sa1",type:"mc",q:"What is the foundation of software engineering as a layered technology?",
 c:["Tools","Methods","Process","Programming"],a:2},
{sec:"sa1",type:"mc",q:"Which term refers to a temporary endeavor designed to produce a unique product or service?",
 c:["Process","Project","Program","Routine"],a:1},
{sec:"sa1",type:"mc",q:"Who is associated with the development and use of the Gantt Chart?",
 c:["Henri Fayol","Henry Gantt","Robert Pressman","Ian Sommerville"],a:1},
{sec:"sa1",type:"mc",q:"What does PERT stand for?",
 c:["Project Execution and Resource Technique","Program/Project Evaluation and Review Technique","Project Evaluation and Reporting Tool","Planning, Execution, Review, and Testing"],a:1},
{sec:"sa1",type:"mc",q:"The process layer serves as the foundation of software engineering as a layered technology.",
 c:["True","False"],a:0},
{sec:"sa1",type:"mc",q:"The formal acceptance and ending of a project takes place during the __________ phase.",
 c:["Closing","Initiation","Planning","Execution"],a:0},
{sec:"sa1",type:"mc",q:"A __________ is a temporary endeavor designed to produce a unique product or service.",
 c:["Program","Project","Process","Portfolio"],a:1},
{sec:"sa1",type:"mc",q:"The project deliverables have been accepted and all work is complete. The manager must decide what to do next. Which action best follows the project management process?",
 c:["Restart the analysis phase.","Formally close the project, settle applicable contracts, and archive documentation.","Add new requirements without approval.","Continue the project indefinitely."],a:1},
{sec:"sa1",type:"mc",q:"Requirements analysis involves determining the conditions that need to be met.",
 c:["True","False"],a:0},
{sec:"sa1",type:"mc",q:"__________ is the procedure of breaking down an intellectual or substantial whole into parts.",
 c:["Synthesis","Analysis","Design","Implementation"],a:1},
{sec:"sa1",type:"mc",q:"Consider these two activities: Activity X separates a complex system into components to study how each part functions. Activity Y combines those components to develop an overall coherent picture. Which classification is correct?",
 c:["X = Synthesis; Y = Analysis","X = Analysis; Y = Synthesis","X = Planning; Y = Implementation","X = Implementation; Y = Closing"],a:1},
{sec:"sa1",type:"mc",q:"If a project team is allocating human resources, materials, and budget to produce planned deliverables, the team is in the implementation/execution phase.",
 c:["True","False"],a:0},
{sec:"sa1",type:"mc",q:"When analysts determine the conditions that a system must meet, they are performing __________ analysis.",
 c:["Feasibility","Design","Requirements","System"],a:2},
{sec:"sa1",type:"mc",q:"A __________ Chart is used to schedule, organize, and coordinate tasks within a project and analyze the time needed to complete them.",
 c:["Gantt","PERT","CPM","WBS"],a:1,
 flag:"Marked wrong as \u201cGantt\u201d in the source attempt; the source's own correct-answer line gives PERT, which matches Question 18 below."},
{sec:"sa1",type:"mc",q:"A proposed system satisfies its technical requirements but does not address the actual needs expressed by stakeholders. Which activity was most likely inadequate?",
 c:["Requirements gathering and analysis","Project closing","File archiving","Contract closure"],a:0},
{sec:"sa1",type:"mc",q:"During system development, the team interviews users and reviews their input to determine what the proposed system should do. Which phase are they performing?",
 c:["Closing","Analysis","Implementation","Maintenance"],a:1},
{sec:"sa1",type:"mc",q:"A PERT Chart is used to schedule, organize, and coordinate tasks within a project.",
 c:["True","False"],a:0},
{sec:"sa1",type:"mc",q:"A development team has identified several user problems and is now trying to develop solutions that meet those needs. Which analysis procedure are they applying?",
 c:["Scope Definition","Problem Analysis","Logical Design","Decision Analysis"],a:1},
{sec:"sa1",type:"mc",q:"Henry __________ is known for his use of the chart that displays project activities over time.",
 c:["Gantt","gantt","GANTT"],a:0},

/* ---------------- Formative 1 (10) ---------------- */
{sec:"f1",type:"mc",q:"Which best describes software?",
 c:["Only the physical components of a computer","A collection of computer programs, procedures, and documentation that perform tasks on a computer system","A device used to store information","A network connection between computers"],a:1},
{sec:"f1",type:"mc",q:"Which type of software is a collection of programs written to service other programs?",
 c:["Application Software","Embedded Software","System Software","Product-line Software"],a:2},
{sec:"f1",type:"mc",q:"Which software category usually consists of stand-alone programs that solve specific business needs?",
 c:["Application Software","System Software","Engineering Software","Embedded Software"],a:0},
{sec:"f1",type:"mc",q:"Which type of software resides within a product or system and implements control features?",
 c:["Web Application","Embedded Software","Application Software","Product-line Software"],a:1},
{sec:"f1",type:"mc",q:"What is a major characteristic of legacy software?",
 c:["It was developed only for mobile devices.","It cannot be modified.","It consists of older programs developed decades ago.","It is always inexpensive to maintain."],a:2},
{sec:"f1",type:"mc",q:"Which is considered an \u201cinfant\u201d software technology in the module?",
 c:["Legacy Software","WebApps","System Software","Engineering Software"],a:1},
{sec:"f1",type:"mc",q:"What does cloud computing enable users to do?",
 c:["Use computing resources only from one location","Share or use computing resources on a broad scale from anywhere or anytime","Eliminate the need for computing devices","Use only stand-alone applications"],a:1},
{sec:"f1",type:"mc",q:"Software engineering is best described as:",
 c:["The physical repair of computer hardware","A process, collection of methods, and tools for building high-quality computer software","The process of purchasing computer programs","The study of computer networks only"],a:1},
{sec:"f1",type:"mc",q:"Which two qualities are required in software engineering according to the module?",
 c:["Speed and complexity","Adaptability and agility","Cost and size","Hardware and networking"],a:1},
{sec:"f1",type:"mc",q:"What is the foundation of software engineering as a layered technology?",
 c:["Tools","Methods","Process","Programming"],a:2},

/* ---------------- Formative 2 (10) ---------------- */
{sec:"f2",type:"mc",q:"Which statement best defines a project?",
 c:["A permanent activity performed every day","A temporary endeavor designed to produce a unique product or service","A routine activity without a specific goal","An activity with no beginning or end"],a:1},
{sec:"f2",type:"mc",q:"Which of the following is NOT considered a project?",
 c:["Creating a unique software application","Developing a new service","Performing routine activities","Constructing a new system"],a:2},
{sec:"f2",type:"mc",q:"A project has a defined beginning and end and is undertaken to meet unique goals; routine activities are not considered projects. Project management is the practice of:",
 c:["Programming software only","Initiating, planning, executing, controlling, and closing the work of a team","Hiring employees only","Performing routine activities without planning"],a:1},
{sec:"f2",type:"mc",q:"What is the primary challenge of project management?",
 c:["Avoiding project documentation","Increasing the number of team members","Achieving project goals within given constraints","Removing all project deadlines"],a:2},
{sec:"f2",type:"mc",q:"Project management aims to achieve specific goals and success criteria within a specified time and given constraints. Who is accountable for accomplishing the stated project objectives?",
 c:["Customer","Project Manager","Programmer only","End user"],a:1},
{sec:"f2",type:"mc",q:"Who is known as the father of planning and control techniques and is famous for the Gantt Chart?",
 c:["Henri Fayol","Henry Gantt","Frederick Taylor","Robert Pressman"],a:1},
{sec:"f2",type:"mc",q:"The module identifies Henry Gantt and Henri Fayol as two forefathers of project management, with Henry Gantt associated with planning and control techniques and the Gantt Chart. In the Gantt Chart shown in the module, the red marks indicate the:",
 c:["Shortest task","Completed tasks","Critical path or longest stretch of the project","Project budget"],a:2},
{sec:"f2",type:"mc",q:"What does PERT stand for?",
 c:["Project Evaluation and Resource Tracking","Program/Project Evaluation and Review Technique","Planning, Execution, Review, and Testing","Project Engineering and Research Technique"],a:1},
{sec:"f2",type:"mc",q:"What is a PERT Chart primarily used for?",
 c:["Designing computer interfaces","Scheduling, organizing, and coordinating project tasks","Writing program code","Creating financial statements"],a:1},
{sec:"f2",type:"mc",q:"A PERT Chart analyzes project tasks and the time needed for each task to help identify the minimum time needed to complete the project. What does \u201canalysis\u201d mean in system analysis?",
 c:["Combining separate elements into a whole","Breaking down a whole into parts","Removing all system components","Creating a final product immediately"],a:1}
];

const SECLABEL = {sa1:"SA1 &middot; Module 1&ndash;2", f1:"Formative 1", f2:"Formative 2"};
const KEYS = ["A","B","C","D","E"];
const stage = document.getElementById("stage");
let opts = {set:"all", shuffleQ:true, shuffleC:true};
let deck = [], at = 0, gridOpen = false;

function pool(){
  if(opts.set==="sa1") return BANK.filter(q=>q.sec==="sa1");
  if(opts.set==="f1") return BANK.filter(q=>q.sec==="f1");
  if(opts.set==="f2") return BANK.filter(q=>q.sec==="f2");
  return BANK.slice();
}
function shuffled(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function buildDeck(list){
  const qs = opts.shuffleQ ? shuffled(list) : list.slice();
  deck = qs.map(q=>({
    ref:q,
    order:(q.type==="mc" ? (opts.shuffleC?shuffled(q.c.map((_,i)=>i)):q.c.map((_,i)=>i)) : []),
    picked:null,
    skipped:false
  }));
  at=0; gridOpen=false;
}
const answered = it => it.picked !== null;
function isCorrect(it){
  const q=it.ref;
  if(q.type==="fill"){
    if(it.picked===null) return false;
    const norm = String(it.picked).trim().toLowerCase();
    return q.accepted.some(x=>x.toLowerCase()===norm);
  }
  return it.picked===q.a;
}
const stateOf = it => answered(it) ? (isCorrect(it)?"ok":"no") : (it.skipped?"sk":"");
const pendingIdx = () => deck.map((it,i)=>i).filter(i=>!answered(deck[i]));
function nextPending(from){
  for(let k=1;k<=deck.length;k++){const i=(from+k)%deck.length; if(!answered(deck[i])) return i;}
  return -1;
}

/* ---------- setup ---------- */
function renderSetup(){
  const nSa1=BANK.filter(q=>q.sec==="sa1").length, nF1=BANK.filter(q=>q.sec==="f1").length, nF2=BANK.filter(q=>q.sec==="f2").length;
  stage.innerHTML = `
    <div class="field">
      <p class="lede">Which set do you want to drill?</p>
      <p class="hint">Every question from the uploaded results, in its original wording.</p>
      <div class="segs">
        <button class="seg" type="button" data-set="all" aria-pressed="false">All sets<span class="n">${nSa1+nF1+nF2} questions</span></button>
        <button class="seg" type="button" data-set="sa1" aria-pressed="false">SA1 &middot; Module 1&ndash;2<span class="n">${nSa1} questions &middot; SE &amp; project mgmt basics</span></button>
        <button class="seg" type="button" data-set="f1" aria-pressed="false">Formative 1<span class="n">${nF1} questions &middot; software types</span></button>
        <button class="seg" type="button" data-set="f2" aria-pressed="false">Formative 2<span class="n">${nF2} questions &middot; projects &amp; PM</span></button>
      </div>
    </div>
    <div class="field">
      <p class="lede">Shuffling</p>
      <label class="switch"><input type="checkbox" id="sq" ${opts.shuffleQ?"checked":""}>
        <span>Shuffle the questions<small>New order every run, so you don't memorize positions.</small></span></label>
      <label class="switch"><input type="checkbox" id="sc" ${opts.shuffleC?"checked":""}>
        <span>Shuffle the choices<small>Stops you from remembering "the third one".</small></span></label>
    </div>
    <div class="btnrow"><button class="btn" id="go">Start reviewing</button></div>`;
  const segs=[...stage.querySelectorAll(".seg")];
  const paint=()=>segs.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.set===opts.set)));
  segs.forEach(b=>b.addEventListener("click",()=>{opts.set=b.dataset.set;paint();}));
  paint();
  stage.querySelector("#sq").addEventListener("change",e=>opts.shuffleQ=e.target.checked);
  stage.querySelector("#sc").addEventListener("change",e=>opts.shuffleC=e.target.checked);
  stage.querySelector("#go").addEventListener("click",()=>{buildDeck(pool());renderQuestion();});
}

/* ---------- question ---------- */
function renderQuestion(){
  const it=deck[at], q=it.ref, done=answered(it);
  const right=deck.filter(d=>stateOf(d)==="ok").length;
  const pend=pendingIdx().length;

  const meter=deck.map((d,i)=>`<i class="${i===at?"now":stateOf(d)}"></i>`).join("");
  const jumps=deck.map((d,i)=>
    `<button class="jump ${stateOf(d)} ${i===at?"now":""}" type="button" data-i="${i}"
      aria-label="Go to question ${i+1}">${i+1}</button>`).join("");

  const body = q.type==="fill"
    ? `<div class="fillrow">
         <input type="text" id="fillinput" autocomplete="off" spellcheck="false"
           placeholder="Type your answer" value="${done?esc(it.picked||""):""}" ${done?"disabled":""}>
         ${done?"":`<button class="btn sm" id="submitfill" type="button">Check</button>`}
       </div>`
    : `<div class="choices">
      ${it.order.map((orig,pos)=>`
        <button class="choice" type="button" data-orig="${orig}" ${done?"disabled":""}>
          <span class="key">${KEYS[pos]}</span>
          <span class="txt">${esc(q.c[orig])}</span>
        </button>`).join("")}
    </div>`;

  stage.innerHTML = `
    <div class="meter">${meter}</div>
    <div class="qhead">
      <span>Question ${at+1} / ${deck.length}</span>
      <button type="button" id="togglegrid">${gridOpen?"Hide":"Jump to question"}</button>
      <span>${right} correct</span>
    </div>
    <div class="grid ${gridOpen?"open":""}" id="grid">
      ${jumps}
      <div class="legend">
        <s><b style="background:var(--right)"></b>correct</s>
        <s><b style="background:var(--wrong)"></b>wrong</s>
        <s><b style="background:var(--skip)"></b>skipped</s>
        <s><b style="background:var(--rule)"></b>not seen</s>
      </div>
    </div>
    <span class="qsec">${SECLABEL[q.sec]}</span>
    <h2 class="qtext">${esc(q.q)}</h2>
    ${body}
    <div class="verdict" id="verdict"></div>
    <div class="nav">
      <button class="btn quiet sm" id="prev" ${at===0?"disabled":""}>&#9664; Previous</button>
      ${done?"":`<button class="btn quiet sm" id="skip">Skip for now</button>`}
      <span class="spacer"></span>
      <button class="btn sm" id="next">Next &#9654;</button>
      <button class="btn ghost sm" id="finish">Finish &amp; score</button>
      ${pend?`<span class="pending">${pend} question${pend>1?"s":""} still unanswered</span>`:``}
    </div>`;

  stage.querySelector("#togglegrid").addEventListener("click",()=>{gridOpen=!gridOpen;renderQuestion();});
  stage.querySelectorAll(".jump").forEach(b=>b.addEventListener("click",()=>{at=+b.dataset.i;renderQuestion();}));
  stage.querySelector("#prev").addEventListener("click",()=>{if(at>0){at--;renderQuestion();}});
  const sk=stage.querySelector("#skip");
  if(sk) sk.addEventListener("click",()=>{deck[at].skipped=true;goNext();});
  stage.querySelector("#next").addEventListener("click",goNext);
  stage.querySelector("#finish").addEventListener("click",renderScore);

  if(done){
    reveal(false);
  } else if(q.type==="fill"){
    const inp=stage.querySelector("#fillinput");
    const submit=()=>{ if(inp.value.trim()==="") return; answerFill(inp.value); };
    stage.querySelector("#submitfill").addEventListener("click",submit);
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); submit(); } });
    inp.focus();
  } else {
    stage.querySelectorAll(".choice").forEach(b=>
      b.addEventListener("click",()=>answer(parseInt(b.dataset.orig,10))));
  }
}

function goNext(){
  if(at < deck.length-1){ at++; renderQuestion(); return; }
  const np = nextPending(at);
  if(np > -1){ at = np; renderQuestion(); }
  else renderScore();
}

function reveal(fresh){
  const it=deck[at], q=it.ref, ok=isCorrect(it);
  if(q.type==="fill"){
    const inp=stage.querySelector("#fillinput");
    if(inp){ inp.disabled=true; inp.classList.add(ok?"right":"wrong"); }
  } else {
    stage.querySelectorAll(".choice").forEach(b=>{
      const o=+b.dataset.orig; b.disabled=true;
      if(o===q.a){b.classList.add("right");b.insertAdjacentHTML("beforeend",`<span class="mark">correct</span>`);}
      else if(o===it.picked){b.classList.add("wrong");b.insertAdjacentHTML("beforeend",`<span class="mark">your answer</span>`);}
      else b.classList.add("dim");
    });
  }
  const v=stage.querySelector("#verdict");
  const correctText = q.type==="fill" ? q.correctDisplay : q.c[q.a];
  v.className="verdict show "+(ok?"hit":"miss");
  v.innerHTML = ok ? `<b>Correct.</b>` : `<b>Not quite.</b><p>The answer is ${esc(correctText)}.</p>`;
  if(q.flag) v.insertAdjacentHTML("beforeend",`<p class="flagnote">${esc(q.flag)}</p>`);
  if(fresh){
    const sk=stage.querySelector("#skip"); if(sk) sk.remove();
    const submit=stage.querySelector("#submitfill"); if(submit) submit.remove();
    const pend=pendingIdx().length;
    const n=stage.querySelector("#next");
    n.textContent = (at===deck.length-1 && pend===0) ? "See your score" : "Next \u25B6";
    n.focus();
  }
}

function answer(orig){
  const it=deck[at];
  if(answered(it)) return;
  it.picked=orig; it.skipped=false;
  reveal(true);
}
function answerFill(text){
  const it=deck[at];
  if(answered(it)) return;
  it.picked=text; it.skipped=false;
  reveal(true);
}

/* ---------- score ---------- */
function renderScore(){
  const done=deck.filter(answered);
  const right=done.filter(isCorrect).length;
  const misses=done.filter(d=>!isCorrect(d));
  const unans=deck.filter(d=>!answered(d));
  const pct=deck.length?Math.round(right/deck.length*100):0;
  const line = unans.length ? `Scored out of all ${deck.length} questions &mdash; ${unans.length} left unanswered count as missed.`
    : pct===100 ? "Clean run. Shuffle it and see if it holds."
    : pct>=80 ? "Solid. Run the missed ones until they're automatic."
    : pct>=60 ? "Getting there. The retry below drills only what you missed."
    : "Worth another pass. Retry the misses first, then the full set.";
  const redoList=[...misses.map(d=>d.ref), ...unans.map(d=>d.ref)];

  const answerText = d => d.ref.type==="fill" ? esc(d.picked||"") : esc(d.ref.c[d.picked]);
  const correctText = q => q.type==="fill" ? esc(q.correctDisplay) : esc(q.c[q.a]);

  stage.innerHTML = `
    <p class="score"><b>${right}/${deck.length}</b><span>${pct}% correct</span></p>
    <p class="scoreline">${line}</p>
    <div class="btnrow">
      <button class="btn" id="again">Repeat this set</button>
      ${unans.length?`<button class="btn ghost" id="back">Go back and answer ${unans.length}</button>`:``}
      ${redoList.length?`<button class="btn ghost" id="redo">Drill the ${redoList.length} missed</button>`:``}
      <button class="btn quiet" id="home">Change settings</button>
    </div>
    <div class="review">
      <h2>${redoList.length?"What to go over":"Review"}</h2>
      ${misses.map(d=>`
        <div class="miss">
          <p>${esc(d.ref.q)}</p>
          <p class="yours">You answered: ${answerText(d)}</p>
          <p class="truth">Answer: ${correctText(d.ref)}</p>
        </div>`).join("")}
      ${unans.map(d=>`
        <div class="miss unans">
          <p>${esc(d.ref.q)}</p>
          <p class="none">Left unanswered</p>
          <p class="truth">Answer: ${correctText(d.ref)}</p>
        </div>`).join("")}
      ${redoList.length?``:`<p class="allgood">Nothing missed &mdash; every answer was right.</p>`}
    </div>`;

  stage.querySelector("#again").addEventListener("click",()=>{buildDeck(pool());renderQuestion();});
  stage.querySelector("#home").addEventListener("click",renderSetup);
  const bk=stage.querySelector("#back");
  if(bk) bk.addEventListener("click",()=>{const p=pendingIdx();at=p[0];gridOpen=false;renderQuestion();});
  const rd=stage.querySelector("#redo");
  if(rd) rd.addEventListener("click",()=>{buildDeck(redoList);renderQuestion();});
  window.scrollTo({top:0,behavior:"smooth"});
}

/* keyboard */
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const it=deck[at];
  if(!it) return;
  if(document.activeElement && document.activeElement.tagName==="INPUT") {
    if(e.key!=="Enter") return;
  }
  const btns=[...document.querySelectorAll(".choice")];
  if(e.key==="ArrowLeft"){const p=document.getElementById("prev");if(p&&!p.disabled){e.preventDefault();p.click();}return;}
  if(e.key==="ArrowRight"){const n=document.getElementById("next");if(n){e.preventDefault();n.click();}return;}
  if(e.key.toLowerCase()==="s"){const s=document.getElementById("skip");if(s){e.preventDefault();s.click();}return;}
  if(answered(it) || !btns.length) return;
  let i=-1;
  if(/^[1-5]$/.test(e.key)) i=+e.key-1;
  else {const k=KEYS.indexOf(e.key.toUpperCase()); if(k>-1) i=k;}
  if(i>-1&&btns[i]){e.preventDefault();btns[i].click();}
});

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
renderSetup();
</script>
<script src="script.js"></script>
</body>
</html>
